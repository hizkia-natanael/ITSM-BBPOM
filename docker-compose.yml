services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bbpom_helpdesk_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env
      - storage_data:/var/www/html/storage
      - public_assets:/var/www/html/public
    networks:
      - shared_db_network

  webserver:
    image: nginx:1.27-alpine
    container_name: bbpom_helpdesk_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_assets:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - shared_db_network

networks:
  shared_db_network:
    external: true

volumes:
  storage_data:
  public_assets:
