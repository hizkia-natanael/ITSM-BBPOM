server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Aturan Subpath Rewrite: Menghilangkan prefix /elite, /ELITE, /helpdesk dari reverse proxy
    location ^~ /elite/ {
        rewrite ^/elite/(.*)$ /$1 last;
    }
    location = /elite {
        rewrite ^/elite$ / last;
    }

    location ^~ /ELITE/ {
        rewrite ^/ELITE/(.*)$ /$1 last;
    }
    location = /ELITE {
        rewrite ^/ELITE$ / last;
    }

    location ^~ /helpdesk/ {
        rewrite ^/helpdesk/(.*)$ /$1 last;
    }
    location = /helpdesk {
        rewrite ^/helpdesk$ / last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Serve uploads from persistent storage
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
